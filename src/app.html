<!doctype html>

<html lang="%paraglide.lang%" dir="%paraglide.dir%">
	<head>
		<meta charset="utf-8" />

		<meta
			name="viewport"
			content="width=device-width, initial-scale=1"
		/>

		<meta name="text-scale" content="scale" />

		<!-- Preloader guard: reduced-motion users skip the overlay pre-paint,
		     so entrance animations start immediately and nothing flashes. -->
		<script>
			(function () {
				try {
					if (window.matchMedia('(prefers-reduced-motion: reduce)').matches)
						document.documentElement.setAttribute('data-preloaded', '');
				} catch (e) {}
			})();
		</script>
		%sveltekit.head%
	</head>

	<body data-sveltekit-preload-data="hover"><div style="display: contents">%sveltekit.body%</div></body>
</html>
